<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peaceful Streets · 화면 목업</title>
<style>
  @font-face { font-family: Galmuri11; font-weight: 400; src: url('../assets/fonts/galmuri/Galmuri11.woff2') format('woff2'); }
  @font-face { font-family: Galmuri11; font-weight: 700; src: url('../assets/fonts/galmuri/Galmuri11-Bold.woff2') format('woff2'); }
  @font-face { font-family: Galmuri9; src: url('../assets/fonts/galmuri/Galmuri9.woff2') format('woff2'); }

  html, body { margin: 0; height: 100%; background: #2f2a3a; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
  }
  #switcher {
    position: fixed; left: 8px; bottom: 8px;
    font: 12px Galmuri11, sans-serif; color: #fff4e0; opacity: .7;
    letter-spacing: 0;
  }
  #switcher b { color: #ffcf4a; font-weight: 400; }
</style>
</head>
<body>
<canvas id="screen" width="480" height="270"></canvas>
<div id="switcher">목업 전환: 1 타이틀 · 2 시작 배너 · 3 플레이 · 4 일시정지 · 5 클리어 · G 격자 · H 숨김 — 현재 <b id="cur"></b></div>
<script src="lib.js"></script>
<script src="mockup.js"></script>
</body>
</html>
